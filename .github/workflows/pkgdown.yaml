on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only deploy from the canonical repository, so a fork's push does not try
    # to publish to a gh-pages branch it does not own.
    if: github.event_name != 'push' || github.repository == 'tenmeh/tanmai-r'
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Same libraries R-CMD-check.yaml installs: magick needs ImageMagick++,
      # V8 needs libnode, and librsvg is what rasterizes the piece art.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libmagick++-dev \
            librsvg2-dev \
            libnode-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      # The site renders the vignette, which knitr cannot do without pandoc.
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
